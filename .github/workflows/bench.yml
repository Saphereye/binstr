name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install strings(1)
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build binstr
        run: cargo build --release

      - name: Bench binstr vs strings
        run: ./scripts/bench.sh strings target/release/binstr 3
